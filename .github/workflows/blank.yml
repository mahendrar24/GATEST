name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PerfAction for JMeter
        # You may pin to the exact commit or the version.
        # uses: QAInsights/PerfAction@d16221318a6d261b1546b9dec9c0bb1739e3d480
        uses: QAInsights/PerfAction@v5.6.3
        with:
          # JMeter test plan to execute
          test-plan-path: './Thread Group.jmx'
          # Where to store the results
          results-file: 'result.jtl'
          # Generate HTML dashboard report
          generate-report: true
          report-folder: 'jmeter-report'

      - name: Upload JTL Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: result.jtl
          if-no-files-found: error

      - name: Upload JMeter HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: jmeter-report
          if-no-files-found: error
